<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishi — Mapa</title>
<meta name="theme-color" content="#000d18">
<meta name="description" content="Fishi 3.0 — pamięć i inteligencja wędkowania. Mapa łowisk.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23041116'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%23067bfb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">

  <main class="map-screen" aria-label="Mapa Fishi">

    <!--
      V0.1 map surface is a static prototype/placeholder (CSS + inline SVG),
      not a real map provider. No real place names, no real geodata.
      See CLAUDE.md §"Otwarte decyzje" — map provider is an unresolved decision.
    -->
    <div class="map-surface" data-map-status="prototype-placeholder" role="img"
         aria-label="Podgląd mapy okolicy (dane demonstracyjne, nie prawdziwa mapa)">
      <svg class="map-art" viewBox="0 0 390 780" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect x="0" y="0" width="390" height="780" fill="url(#mapBg)"/>
        <path class="map-water" d="M-20,120 C60,160 90,260 40,320 C0,360 40,430 120,420 C210,410 230,500 190,560 C150,620 220,660 300,630 C360,606 410,660 410,700 L410,800 L-20,800 Z" />
        <path class="map-water map-water--soft" d="M410,60 C330,90 300,170 350,230 C390,275 360,330 300,320 C230,308 190,370 230,420" fill="none" />
        <g class="map-grid">
          <circle cx="40" cy="80" r="1.4"/><circle cx="120" cy="140" r="1.4"/><circle cx="260" cy="90" r="1.4"/>
          <circle cx="330" cy="200" r="1.4"/><circle cx="70" cy="260" r="1.4"/><circle cx="200" cy="230" r="1.4"/>
          <circle cx="310" cy="330" r="1.4"/><circle cx="150" cy="380" r="1.4"/><circle cx="60" cy="420" r="1.4"/>
          <circle cx="250" cy="460" r="1.4"/><circle cx="340" cy="500" r="1.4"/><circle cx="110" cy="540" r="1.4"/>
          <circle cx="200" cy="600" r="1.4"/><circle cx="320" cy="640" r="1.4"/><circle cx="60" cy="660" r="1.4"/>
        </g>
        <defs>
          <radialGradient id="mapBg" cx="50%" cy="38%" r="75%">
            <stop offset="0%" stop-color="#0b2430"/>
            <stop offset="55%" stop-color="#041116"/>
            <stop offset="100%" stop-color="#000a12"/>
          </radialGradient>
        </defs>
      </svg>

      <div class="map-user-dot" aria-hidden="true"><span class="map-user-dot__ring"></span></div>

      <p class="map-placeholder-tag">Mapa demonstracyjna — bez rzeczywistych danych</p>
    </div>

    <header class="map-topbar">
      <div class="brand" aria-hidden="false">
        <span class="brand-mark">Fishi</span>
      </div>
      <div class="topbar-controls">
        <button type="button" class="icon-btn" data-action="locate" aria-label="Wyśrodkuj na mojej lokalizacji">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button type="button" class="icon-btn" data-action="layers" aria-label="Warstwy mapy">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="search-bar-wrap">
      <form class="search-bar" role="search" autocomplete="off" data-action="search-form">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <label class="visually-hidden" for="location-search">Miejscowość lub adres</label>
        <input id="location-search" name="location-search" type="search"
               placeholder="Miejscowość lub adres…" autocomplete="off" />
      </form>
    </div>

    <div class="map-bottom-tools">
      <button type="button" class="ghost-chip" data-action="start-trip">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-7-5.2-7-11a7 7 0 1 1 14 0c0 5.8-7 11-7 11Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Jestem nad wodą</span>
      </button>

      <button type="button" class="scan-btn" data-action="scan" aria-label="Skanuj okoliczne łowiska">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.4" opacity="0.55"/><circle cx="12" cy="12" r="10.6" stroke="currentColor" stroke-width="1.1" opacity="0.3"/></svg>
        <span>Skanuj</span>
      </button>
    </div>

  </main>

  <nav class="bottom-nav" aria-label="Główna nawigacja">
    <button type="button" class="nav-item is-active" data-nav="mapa" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Mapa</span>
    </button>
    <button type="button" class="nav-item" data-nav="wyprawy">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v20M5 8c2 2 5-2 7 0s5-2 7 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Wyprawy</span>
    </button>
    <button type="button" class="nav-item nav-item--fab" data-nav="add" aria-label="Szybka akcja">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="nav-item" data-nav="fishibox">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 8l9-5 9 5-9 5-9-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 8v8l9 5 9-5V8M12 13v8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>FishiBox</span>
    </button>
    <button type="button" class="nav-item" data-nav="profil">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.6-3.6 5-5.4 7.5-5.4s5.9 1.8 7.5 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
